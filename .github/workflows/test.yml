name: Run Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: '.fvmrc'
          channel: 'stable'
      - run: flutter pub get
      - run: dart run scripts/generate_localizations.dart
      - run: flutter test
