name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: '.fvmrc'
          channel: 'stable'
      - run: flutter pub get
      - run: dart run scripts/generate_localizations.dart
      - run: flutter build apk --release --target-platform android-arm64
      - name: Archive versioned APK
        id: archive
        shell: bash
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r')
          filename="mathani-arm64-v8a-release-${version/+/(}).apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$filename"
          echo "path=$filename" >> "$GITHUB_OUTPUT"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          overwrite_files: false
          files: ${{ steps.archive.outputs.path }}
