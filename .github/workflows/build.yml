name: Generate and Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: '.fvmrc'
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get

    - name: Generate localizations
      run: dart run scripts/generate_localizations.dart
    
    - name: Run code generation
      run: dart run build_runner build
    
    - name: Run analyzer
      run: flutter analyze
    
    - name: Run tests
      run: flutter test
