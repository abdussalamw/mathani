<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسميع تدبر - القرآن الكريم</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(207,176,88,0.3);
            padding: 50px 40px;
            border-radius: 24px;
            width: 90%;
            max-width: 750px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .logo { font-size: 14px; color: #cfb058; letter-spacing: 3px; margin-bottom: 8px; }
        h1 { font-family: 'Amiri', serif; font-size: 28px; color: #cfb058; margin-bottom: 40px; }

        .result-box {
            min-height: 160px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(207,176,88,0.2);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 36px;
            font-family: 'Amiri', serif;
            font-size: 26px;
            line-height: 2;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .result-box.recording { border-color: #f44336; box-shadow: 0 0 20px rgba(244,67,54,0.3); }
        .result-box.processing { border-color: #cfb058; box-shadow: 0 0 20px rgba(207,176,88,0.3); }
        .result-box.done { border-color: #4caf50; box-shadow: 0 0 20px rgba(76,175,80,0.2); }

        .mic-btn {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #cfb058;
            background: rgba(207,176,88,0.15);
            color: #cfb058;
            font-size: 40px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            user-select: none;
        }
        .mic-btn:hover { background: rgba(207,176,88,0.25); transform: scale(1.05); }
        .mic-btn.active {
            background: rgba(244,67,54,0.3);
            border-color: #f44336;
            color: #f44336;
            box-shadow: 0 0 30px rgba(244,67,54,0.5);
            animation: pulse-ring 1s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(244,67,54,0.5); }
            70% { box-shadow: 0 0 0 20px rgba(244,67,54,0); }
            100% { box-shadow: 0 0 0 0 rgba(244,67,54,0); }
        }
        .instruction {
            font-size: 16px;
            color: rgba(255,255,255,0.6);
            margin-top: 8px;
        }
        .instruction.active { color: #f44336; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">MATHANI · مثاني</div>
        <h1>اختبار التسميع - نموذج تدبر</h1>

        <div class="result-box" id="result">
            اضغط على الميكروفون وابدأ القراءة...
        </div>

        <div class="mic-btn" id="micBtn" onmousedown="startRec()" onmouseup="stopRec()" ontouchstart="startRec()" ontouchend="stopRec()">
            🎙️
        </div>
        <div class="instruction" id="instruction">اضغط مع الاستمرار للتسجيل</div>
    </div>

    <script>
        let ws;
        const resultDiv = document.getElementById('result');
        const micBtn = document.getElementById('micBtn');
        const instruction = document.getElementById('instruction');
        let wordsAccumulated = [];

        function connect() {
            ws = new WebSocket("ws://127.0.0.1:9090/ws");
            ws.onopen = () => console.log("Connected to Tadabur");

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.status === "recording") {
                    wordsAccumulated = [];
                    resultDiv.className = "result-box recording";
                    resultDiv.innerHTML = "<span style='opacity:0.5'>🎙️ جارٍ التسجيل...</span>";

                } else if (data.status === "processing") {
                    resultDiv.className = "result-box processing";
                    resultDiv.innerHTML = "<span style='opacity:0.5'>⏳ تدبر يحلل تلاوتك...</span>";
                    micBtn.classList.remove("active");
                    instruction.className = "instruction";
                    instruction.innerText = "اضغط مع الاستمرار للتسجيل";

                } else if (data.full_text !== undefined) {
                    // بداية البث الكلمة بكلمة - تهيئة العرض
                    wordsAccumulated = [];
                    resultDiv.className = "result-box done";
                    resultDiv.innerHTML = "";

                } else if (data.word !== undefined) {
                    // إضافة كلمة جديدة
                    wordsAccumulated.push(data.word);
                    
                    // عرض الكلمات المتراكمة مع تمييز آخر كلمة
                    const allWords = wordsAccumulated.map((w, i) => {
                        if (i === wordsAccumulated.length - 1) {
                            // آخر كلمة - مضيئة
                            return `<span style="color:#cfb058; text-shadow: 0 0 12px rgba(207,176,88,0.8)">${w}</span>`;
                        }
                        return `<span style="opacity:0.85">${w}</span>`;
                    });
                    resultDiv.innerHTML = allWords.join(" ");

                    // إذا انتهت الكلمات، نجعل الكل بلون ثابت
                    if (data.done) {
                        setTimeout(() => {
                            resultDiv.innerHTML = wordsAccumulated.join(" ");
                        }, 500);
                    }

                } else if (data.text) {
                    // fallback: عرض النص مرة واحدة
                    resultDiv.className = "result-box done";
                    resultDiv.innerText = data.text;
                }
            };

            ws.onclose = () => setTimeout(connect, 1000);
        }

        function startRec() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send("record");
            micBtn.classList.add("active");
            instruction.className = "instruction active";
            instruction.innerText = "ارفع إصبعك عند الانتهاء";
        }

        function stopRec() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send("done");
        }

        connect();
    </script>
</body>
</html>
